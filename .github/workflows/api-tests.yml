name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 02:30 UTC — off-peak for both the Heroku-hosted API and runner queues
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Postman environment to run against
        type: choice
        options:
          - production
        default: production

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Newman collection run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Falls back to production for push / PR / schedule events
      TARGET_ENV: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full collection (cli + htmlextra + junit)
        run: >
          npx newman run collections/restful-booker.postman_collection.json
          -e environments/${TARGET_ENV}.postman_environment.json
          --reporters cli,htmlextra,junit
          --reporter-htmlextra-export reports/html/index.html
          --reporter-junit-export reports/junit/results.xml

      - name: Data-driven regression (3 iterations)
        run: >
          npx newman run collections/restful-booker.postman_collection.json
          -e environments/${TARGET_ENV}.postman_environment.json
          -d data/booking-test-data.json
          --reporters cli,junit
          --reporter-junit-export reports/junit/data-driven.xml

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: reports/html/
          retention-days: 30

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-junit-results
          path: reports/junit/
          retention-days: 30

      - name: Write run summary
        if: always()
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          console.log('## API Test Results\n');
          let files = [];
          try { files = fs.readdirSync('reports/junit').filter(f => f.endsWith('.xml')); } catch {}
          if (files.length === 0) {
            console.log('No results generated.');
            process.exit(0);
          }
          console.log('| Report | Tests | Failures | Errors |');
          console.log('|---|---|---|---|');
          for (const f of files) {
            const xml = fs.readFileSync(`reports/junit/${f}`, 'utf8');
            const sum = (attr) => {
              let total = 0;
              // Sum the attribute across all <testsuite> elements
              for (const m of xml.matchAll(new RegExp(`<testsuite\\b[^>]*\\b${attr}="(\\d+)"`, 'g'))) {
                total += Number(m[1]);
              }
              return total;
            };
            console.log(`| ${f} | ${sum('tests')} | ${sum('failures')} | ${sum('errors')} |`);
          }
          EOF
